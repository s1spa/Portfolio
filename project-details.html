<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деталі проєкту - Ілля Авдосьєв</title>
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/project-details.css">
</head>

<body data-theme="dark">
    <header>
        <nav>
            <a href="index.html" class="logo">IA</a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">Головна</a></li>
                <li><a href="projects.html" data-i18n="nav.projects">Проєкти</a></li>
                <li><a href="about.html" data-i18n="nav.about">Про мене</a></li>
            </ul>
            <div class="controls">
                <button class="theme-toggle" id="theme-toggle">
                    <span id="theme-icon">🌞</span>
                </button>
                <select class="lang-switch" id="lang-switch">
                    <option value="uk">🇺🇦 UA</option>
                    <option value="en" selected>🇬🇧 EN</option>
                    <option value="pl">🇵🇱 PL</option>
                    <option value="de">🇩🇪 DE</option>
                </select>
            </div>
        </nav>
    </header>

    <main>
        <div class="container" id="project-content">
            <div class="loading"><span class="icon loader-icon" style="-webkit-mask-image: url(images/icons/loader.svg); mask-image: url(images/icons/loader.svg);"></span> <span data-i18n="projectDetails.loading">Завантаження...</span></div>
        </div>
    </main>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close"><span class="icon" style="width: 20px; height: 20px; -webkit-mask-image: url(images/icons/close.svg); mask-image: url(images/icons/close.svg);"></span></span>
        <img id="modalImage" src="" alt="Full size image" onclick="event.stopPropagation()">
    </div>

    <footer>
        <p>&copy; 2025 <span id="footer-name">Ілля Авдосьєв</span>. <span data-i18n="footer.rights">Усі права захищено.</span></p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <script>
        const DEFAULT_PROJECTS = { projects: [] };

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = parseInt(urlParams.get('id'));
            const currentLang = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : 'uk';

            if (!projectId) {
                window.location.href = 'projects.html';
                return;
            }

            try {
                const response = await fetch('data/projects.json');
                const projectsData = response.ok ? await response.json() : DEFAULT_PROJECTS;
                const project = projectsData.projects.find(p => p.id === projectId);

                if (!project) {
                    document.getElementById('project-content').innerHTML = `
                        <div class="loading">
                            <h2>Проєкт не знайдено</h2>
                            <a href="projects.html" class="btn btn-primary">← Назад до проєктів</a>
                        </div>
                    `;
                    return;
                }

                renderProject(project, currentLang);
            } catch (error) {
                console.error('Error loading project:', error);
                document.getElementById('project-content').innerHTML = `<h2>Помилка завантаження</h2>`;
            }
        }

        function renderProject(project, lang) {
            const container = document.getElementById('project-content');
            const allMedia = [];

            // Спочатку відео, потім галерея
            if (project.videos) project.videos.forEach(v => allMedia.push({ type: 'video', url: v }));
            if (project.gallery) project.gallery.forEach(img => allMedia.push({ type: 'image', url: img }));

            window.projectMedia = allMedia;
            const mainImage = project.mainImage || project.image;

            container.innerHTML = `
                <a href="projects.html" class="back-button">
                    <span data-i18n="projectDetails.backToProjects">← Назад до проєктів</span>
                </a>
                
                <div class="project-header">
                    <h1 class="project-title">
                        <span class="icon title-icon" style="-webkit-mask-image: url(images/icons/${project.icon || 'folder'}.svg); mask-image: url(images/icons/${project.icon || 'folder'}.svg);"></span> ${project.title[lang] || project.title.uk}
                        ${project.status ? `<span class="project-status">${t('common.' + project.status)}</span>` : ''}
                    </h1>
                </div>

                <div class="steam-layout">
                    <div class="media-column">
                        <div class="main-media" id="main-media">
                            ${renderMainMedia(allMedia[0])}
                        </div>
                        
                        ${allMedia.length > 1 ? `
                            <div class="thumbnails">
                                ${allMedia.map((m, i) => `
                                    <div class="thumbnail ${i === 0 ? 'active' : ''}" onclick="switchMedia(${i})">
                                        <img src="${m.type === 'image' ? m.url : `https://img.youtube.com/vi/${extractYouTubeID(m.url)}/mqdefault.jpg`}">
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="info-column">
                        ${mainImage ? `<div class="main-title-image"><img src="${mainImage}" style="width:100%; border-radius:4px;"></div>` : ''}
                        
                        <div class="short-description">
                            ${project.shortDescription ? (project.shortDescription[lang] || project.shortDescription.uk) : ''}
                        </div>

                        <div class="project-tags">
                            ${project.technologies.map(tech => `<span class="tag">${tech}</span>`).join('')}
                        </div>

                        <div class="project-links" style="display: flex; gap: 0.5rem; margin-top:1rem;">
                            ${project.github ? `<a href="${project.github}" class="btn btn-primary" target="_blank"><span class="icon btn-icon" style="-webkit-mask-image: url(images/icons/about/github.svg); mask-image: url(images/icons/about/github.svg);"></span> GitHub</a>` : ''}
                            ${project.download ? `<a href="${project.download}" class="btn btn-secondary" target="_blank"><span class="icon btn-icon" style="-webkit-mask-image: url(images/icons/download.svg); mask-image: url(images/icons/download.svg);"></span> Download</a>` : ''}
                        </div>
                    </div>
                </div>

                <div style="margin: 3rem 0;">
                    <h2 class="section-title">
                        <span class="icon" style="-webkit-mask-image: url(images/icons/file.svg); mask-image: url(images/icons/file.svg); width: 0.9em; height: 0.9em; vertical-align: -0.08em; margin-right: 0.4em;"></span><span data-i18n="projectDetails.detailedDescription">Детальний опис</span>
                    </h2>
                    <div class="project-description">${formatDescription(project.description[lang] || project.description.uk)}</div>
                </div>

               ${project.features && project.features.length > 0 ? `
                    <div class="features-section">
                        <h2 class="section-title">
                            <span data-i18n="projectDetails.features">✨ Особливості</span>
                        </h2>
                        <ul class="features-list">
                            ${project.features.map(f => `
                                <li class="feature-item">
                                    <div class="feature-icon"><span class="icon" style="-webkit-mask-image: url(images/icons/${f.icon || 'checkmark'}.svg); mask-image: url(images/icons/${f.icon || 'checkmark'}.svg);"></span></div>
                                    <div class="feature-content">
                                        <h3>${f.title[lang] || f.title.uk}</h3>
                                        <p>${f.description[lang] || f.description.uk}</p>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;
            
            // ✅ КРИТИЧНО: Переклад після рендеру
            translatePage();
        }

        function formatDescription(text) {
            if (!text) return '';
            let lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach(line => {
                line = line.trim();
                if (!line) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<br>'; return;
                }

                if (line.startsWith('* ') || line.startsWith('- ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += '<li>' + line.substring(2) + '</li>';
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    line = line.replace(/\*\*(.*?):\*\*/g, '<strong>$1:</strong>');
                    html += '<p>' + line + '</p>';
                }
            });
            if (inList) html += '</ul>';
            return html;
        }

        function renderMainMedia(media) {
            if (!media) {
                return '<div class="image-placeholder"><span class="icon" style="width: 48px; height: 48px; -webkit-mask-image: url(images/icons/folder.svg); mask-image: url(images/icons/folder.svg);"></span></div>';
            }
            if (media.type === 'image') return `<img src="${media.url}" onclick="openModal('${media.url}')">`;
            return `<iframe src="${media.url}" frameborder="0" allowfullscreen></iframe>`;
        }

        function switchMedia(index) {
            const mainMedia = document.getElementById('main-media');
            const thumbs = document.querySelectorAll('.thumbnail');
            thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
            mainMedia.innerHTML = renderMainMedia(window.projectMedia[index]);
        }

        function extractYouTubeID(url) {
            const match = url.match(/embed\/([^?]+)/);
            return match ? match[1] : '';
        }

        function openModal(src) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadProjectDetails();
            // Обробники подій для контролів
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('lang-switch').addEventListener('change', (e) => changeLanguage(e.target.value));
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
